name: Build News Reel

on:
  workflow_dispatch:
  schedule:
    # 48 videos a day (UTC): every hour, on the hour.
    # Schedule re-registered 2026-11-17 ~23:00 UTC to wake the scheduler.
    # Each batch builds AND uploads BOTH a Reel and a long video
    # (48 uploads/day; YouTube quota is 100 video uploads/day per
    # project (videos.insert in its own bucket) + 10,000 units for
    # other calls — quota is not the blocker).
    - cron: "0 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      # Media pool (data/media_pool/): pre-fetched visuals + pre-rendered
      # template audio, so the builders pick ready files instead of calling
      # the live APIs for every story. Runners are ephemeral, so the pool
      # survives between runs ONLY via this cache. Key = current ISO week:
      # a new week misses the exact key, restores last week's pool via
      # restore-keys, the pre-fetch step tops it up, and the post-step saves
      # it under the new key. (Within a week, later runs restore the pool
      # saved by the first run of the week; their own top-ups are NOT
      # re-saved — they are re-fetched cheaply instead. Pool files are never
      # committed to the repo: too heavy, ~44 video clips.)
      - name: Pool cache key
        id: poolkey
        run: echo "week=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore media pool cache
        uses: actions/cache@v4
        with:
          path: data/media_pool
          key: media-pool-${{ steps.poolkey.outputs.week }}
          restore-keys: |
            media-pool-
      - name: Pre-fetch media pool
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python scripts/prefetch_media.py
      - name: Generate fresh stories
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_story.py
      # EVERY run builds BOTH a Reel and a long video, with OPPOSITE topics.
      # Alternation is by github.run_number parity (run_number increments by
      # 1 on every run of this workflow, so the two formats always swap):
      #   even run_number -> Reel = horror, long video = anime
      #   odd run_number  -> Reel = anime, long video = horror
      - name: Pick alternating modes
        id: modes
        run: |
          if [ $(( ${{ github.run_number }} % 2 )) -eq 0 ]; then
            echo "reel_mode=horror" >> "$GITHUB_OUTPUT"
            echo "long_mode=anime" >> "$GITHUB_OUTPUT"
          else
            echo "reel_mode=anime" >> "$GITHUB_OUTPUT"
            echo "long_mode=horror" >> "$GITHUB_OUTPUT"
          fi
      - name: Show modes
        run: |
          echo "Run #${{ github.run_number }}: Reel mode=${{ steps.modes.outputs.reel_mode }}, long video mode=${{ steps.modes.outputs.long_mode }}"
      - name: Build the Reel
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          STORY_MODE: ${{ steps.modes.outputs.reel_mode }}
          STORY_ROTATION_SEED: ${{ github.run_number }}
        run: python build_reel.py
      - name: Build the long video
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          STORY_MODE: ${{ steps.modes.outputs.long_mode }}
          STORY_ROTATION_SEED: ${{ github.run_number }}
        run: python build_long_video.py
      - name: Upload Reel as artifact
        if: hashFiles('out/reel.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: news-reel
          path: |
            out/reel.mp4
            out/stories.json
          retention-days: 7
      - name: Upload long video as artifact
        if: hashFiles('out/long_video.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: news-long-video
          path: |
            out/long_video.mp4
            out/long_stories.json
          retention-days: 7
      - name: Upload Reel to YouTube
        if: hashFiles('out/reel.mp4') != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python upload_youtube.py
      - name: Upload long video to YouTube
        if: hashFiles('out/long_video.mp4') != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python upload_youtube.py --file out/long_video.mp4 --stories out/long_stories.json --mode long
      # Facebook auto-publishing (Page "Breaking news", permanent token).
      # Runs AFTER YouTube; a Facebook failure never fails the workflow
      # (upload_facebook.py exits 0 with a warning on any error).
      - name: Upload Reel to Facebook
        if: hashFiles('out/reel.mp4') != ''
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: python upload_facebook.py
      - name: Upload long video to Facebook
        if: hashFiles('out/long_video.mp4') != ''
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: python upload_facebook.py --file out/long_video.mp4 --stories out/long_stories.json --mode long
      # Cross-batch no-repeat: the builders recorded the stories used in
      # this run in data/used_stories.json — commit it back so the next
      # run picks fresh stories. A push to main does NOT re-trigger this
      # workflow (it runs on schedule + dispatch only). A failed push
      # never fails the run (the videos are already uploaded).
      - name: Save used stories
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/used_stories.json
          git diff --cached --quiet || git commit -m "Mark stories as used (run ${{ github.run_number }})"
          git push || echo "WARNING: could not push used stories"
